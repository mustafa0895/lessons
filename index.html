<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Mustafa · Interactive Lessons</title>
<style>
:root{--sand:#F7F1E8;--ink:#1F2A37;--terra:#C8553D;--teal:#2A9D8F;--ochre:#E9B44C;--clay:#8C5A3C;--line:#E2D5C0;--muted:#6B7480}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
header .logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,var(--ink),var(--teal));display:grid;place-items:center;font-size:22px;flex:none}
header h1{font-size:20px;margin:0}
header .tag{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
header small{display:block;direction:rtl;text-align:left;color:var(--clay);font-weight:700;font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 6px;font-size:14px}
.crumbs a{color:var(--teal);font-weight:700;text-decoration:none}
.crumbs span{color:var(--muted)}
h2{margin:6px 0 2px;font-size:24px}
.ar{direction:rtl;color:var(--clay);font-weight:700}
p.sub{margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:110px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(31,42,55,.06)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:30px}
.tile b{font-size:18px;display:block}
.tile .ar{font-size:14px;display:block}
.tile .n{font-size:12px;color:var(--muted);font-weight:600}
.term{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.term>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;padding:14px 16px;font:inherit;font-weight:800;font-size:17px;color:var(--ink);text-align:left}
.term>button .ar{font-size:14px}
.term>button i{font-style:normal;transition:transform .2s;color:var(--muted)}
.term.open>button i{transform:rotate(90deg)}
.term .body{display:none;padding:0 12px 12px}
.term.open .body{display:block}
.now{font-size:11px;font-weight:700;background:var(--teal);color:#fff;border-radius:999px;padding:3px 8px;margin-left:auto;white-space:nowrap}
.unit{margin:8px 4px 6px;font-size:13px;font-weight:800;color:var(--terra);text-transform:uppercase;letter-spacing:.04em}
.unit .ar{display:block;text-transform:none;letter-spacing:0;font-size:13px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--sand);border-radius:12px;padding:12px;margin-bottom:6px;text-decoration:none;color:var(--ink)}
.lesson .num{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.lesson b{display:block;font-size:15px}
.lesson .ar{display:block;font-size:13px;font-weight:600}
.soon{color:var(--muted);font-size:14px;padding:4px 6px 8px}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}

.arbtn{margin-left:auto;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;color:var(--ink);flex:none}
body.showar .arbtn{background:var(--teal);border-color:var(--teal);color:#fff}
body:not(.showar) .ar{display:none!important}
@media (hover:hover){
 body:not(.showar) .tile:hover .ar,body:not(.showar) .lesson:hover .ar,body:not(.showar) .term>button:hover .ar,body:not(.showar) .unit:hover .ar,body:not(.showar) header:hover small{display:block!important}
 body:not(.showar) .tile:hover,body:not(.showar) .lesson:hover{border-color:var(--teal)}
}

.hero{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--ink),#24515a 60%,var(--teal));color:#fff;border-radius:20px;padding:16px 14px 16px 18px;margin:14px 0 18px;overflow:hidden}
.hero h2{color:#fff;font-size:19px;margin:0 0 6px;line-height:1.25}
.hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.4}
.hero .hz{width:78px;flex:none;margin:-6px 0 -22px}.hero .hz svg{width:100%;height:auto;display:block}
.grid,.terms{margin-top:12px}
@media (min-width:900px){.grid,.terms{margin-top:18px}}
@media (min-width:900px){
 main{max-width:1120px;padding:28px 40px 60px}
 header .logo{width:56px;height:56px;font-size:28px;border-radius:16px}
 header h1{font-size:26px}
 .hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(120deg,var(--ink),#24515a 60%,var(--teal));color:#fff;border-radius:24px;padding:34px 40px;margin:18px 0 26px}
 .hero h2{color:#fff;font-size:34px;margin:0 0 8px}
 .hero p{margin:0;opacity:.85;font-size:17px;max-width:520px;line-height:1.5}
 .hero .hz{width:150px;flex:none;margin:-10px 0 -34px}.hero .hz svg{width:100%;height:auto;display:block}
 .hero .sym{font:700 54px "Cambria Math",Cambria,serif;color:var(--ochre);letter-spacing:10px;white-space:nowrap}
 h2{font-size:30px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
 .tile{min-height:170px;padding:22px;border-radius:22px;transition:transform .15s,box-shadow .15s,border-color .15s}
 .tile:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(31,42,55,.12);border-color:var(--teal)}
 .tile .ic{font-size:40px}
 .tile b{font-size:22px}
 .terms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
 .term{margin:0}
 .term .body{display:block}
 .term>button{cursor:default;pointer-events:none}
 .term>button i{display:none}
 .lesson{transition:background .15s}
 .lesson:hover{background:#EFE4D2}
 .crumbs{font-size:15px}
}
</style>
</head>
<body>
<main>
  <header><div class="logo">👨‍🔬</div><div><h1>Mr. Mustafa</h1><span class="tag">Interactive Lessons</span><small class="ar">الدروس التفاعلية مع أ. مصطفى</small></div><button class="arbtn" id="arBtn" aria-label="Show Arabic">ع</button></header>
  <div id="app"></div>
  <noscript>
    <h2>All lessons</h2>
    <p><a href="g9-math-l1.html">Grade 9 Math · Numerical Expressions</a></p>
    <p><a href="g9-science-l1.html">Grade 9 Science · L1 Organisms and Their Relationships</a></p>
    <p><a href="g9-science-l2.html">Grade 9 Science · L2 Ecology and the Biosphere</a></p>
    <p><a href="g9-science-l3.html">Grade 9 Science · L3 Levels of Organization</a></p>
    <p><a href="g7-science-l1.html">Grade 7 Science · Rock and Fossil Records</a></p>
    <p><a href="math-volume-l2-7.html">Grade 7 Math · Solving Problems Involving Volume</a></p>
  </noscript>
  <footer>Open lessons in Safari or Chrome<br><span class="ar" dir="rtl">افتح الدروس في Safari أو Chrome</span></footer>
</main>
<script>
function zayed(m){
  m=m||"happy";
  const uid="z"+Math.random().toString(36).slice(2,7);
  const skin="#C68A5C", skinD="#A86F45", hair="#1E1410";
  // arms
  const coatArm=(d)=>`<path d="${d}" fill="url(#${uid}coat)" stroke="#C9D3DD" stroke-width="2" stroke-linejoin="round"/>`;
  const hand=(x,y,r=9)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${skin}"/><circle cx="${x-2}" cy="${y-2}" r="${r*0.45}" fill="#D9A074" opacity=".6"/>`;
  let arms="", front="";
  if(m==="happy"){ // waving right hand
    arms=coatArm("M58,168 q-18,26 -14,62 l18,2 q2,-30 12,-50z")+hand(52,236)+
         coatArm("M142,168 q22,-10 34,-44 l-16,-8 q-10,26 -26,34z")+hand(170,112,10)+
         `<path d="M181,100 q6,-6 4,-14 M188,110 q8,-4 8,-12" stroke="#E9B44C" stroke-width="3" fill="none" stroke-linecap="round"/>`;
  } else if(m==="think"){ // hand on chin
    arms=coatArm("M58,168 q-18,26 -14,62 l18,2 q2,-30 12,-50z")+hand(52,236)+
         coatArm("M138,166 q20,10 16,40 l-18,0 q2,-20 -10,-28z");
    front=`<path d="M146,204 Q150,170 124,150" stroke="#C9D3DD" stroke-width="21" fill="none" stroke-linecap="round"/><path d="M146,204 Q150,170 124,150" stroke="#F4F7FA" stroke-width="17" fill="none" stroke-linecap="round"/>`+hand(118,144,10)+
         `<g transform="translate(150,30)"><circle r="14" fill="#fff" stroke="#2A9D8F" stroke-width="2.5"/><text y="6" text-anchor="middle" font-size="18" font-weight="800" fill="#2A9D8F" font-family="Arial">?</text><circle cx="-14" cy="20" r="4" fill="#fff" stroke="#2A9D8F" stroke-width="2"/></g>`;
  } else if(m==="wow"){ // both hands up
    arms=coatArm("M60,168 q-26,-6 -34,-40 l16,-6 q8,24 24,28z")+hand(30,118,10)+
         coatArm("M140,168 q26,-6 34,-40 l-16,-6 q-8,24 -24,28z")+hand(170,118,10)+
         `<g fill="#E9B44C"><path d="M22,92 l3,8 8,3 -8,3 -3,8 -3,-8 -8,-3 8,-3z"/><path d="M178,88 l2.5,6 6,2.5 -6,2.5 -2.5,6 -2.5,-6 -6,-2.5 6,-2.5z"/></g>`;
  } else { // point: holds magnifier, points right
    arms=coatArm("M58,168 q-22,22 -18,56 l18,2 q0,-26 14,-44z")+
         `<g><circle cx="44" cy="226" r="17" fill="rgba(160,220,214,.45)" stroke="#1F2A37" stroke-width="5"/><path d="M54,240 l12,16" stroke="#1F2A37" stroke-width="8" stroke-linecap="round"/><path d="M36,218 q4,-6 10,-6" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/></g>`+hand(58,248,9)+
         coatArm("M142,170 q24,4 44,-4 l-2,-16 q-22,6 -40,2z")+hand(190,158,9)+
         `<path d="M196,156 l12,-2" stroke="${skin}" stroke-width="6" stroke-linecap="round"/>`;
  }
  const brows={happy:"M74,84 q10,-7 20,-2 M106,82 q10,-5 20,2",think:"M74,82 q10,-3 20,1 M106,78 q10,-8 20,-3",wow:"M74,78 q10,-8 20,-3 M106,75 q10,-5 20,3",point:"M74,84 q10,-7 20,-2 M106,82 q10,-5 20,2"}[m];
  const mouth={
    happy:`<path d="M88,124 q12,14 24,0 q-12,4 -24,0z" fill="#7A2E1F"/><path d="M92,126 q8,3 16,0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`,
    point:`<path d="M88,124 q12,14 24,0 q-12,4 -24,0z" fill="#7A2E1F"/><path d="M92,126 q8,3 16,0" stroke="#fff" stroke-width="3" stroke-linecap="round"/>`,
    think:`<path d="M92,128 q8,-4 18,0" stroke="#7A2E1F" stroke-width="3.5" fill="none" stroke-linecap="round"/>`,
    wow:`<ellipse cx="100" cy="128" rx="7" ry="9" fill="#7A2E1F"/><ellipse cx="100" cy="132" rx="4" ry="3" fill="#E58C7A"/>`}[m];
  const look=m==="think"?-3:m==="point"?3:0;
  const eye=(x)=>`<ellipse cx="${x}" cy="100" rx="9" ry="10.5" fill="#fff"/><circle cx="${x+look}" cy="${m==="think"?98:101}" r="6.5" fill="#4A2C1A"/><circle cx="${x+look}" cy="${m==="think"?98:101}" r="3.4" fill="#120B07"/><circle cx="${x+look+2.2}" cy="${m==="think"?95.5:98.5}" r="2" fill="#fff"/>`;
  return `<svg viewBox="0 0 210 290" aria-label="Zayed the young scientist" role="img"><defs>
<linearGradient id="${uid}coat" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#E3E9EF"/></linearGradient>
<radialGradient id="${uid}face" cx=".4" cy=".35" r=".7"><stop offset="0" stop-color="#D9A074"/><stop offset=".7" stop-color="${skin}"/><stop offset="1" stop-color="${skinD}"/></radialGradient>
<linearGradient id="${uid}lens" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#BFF0E8"/><stop offset="1" stop-color="#4DB6A6"/></linearGradient>
<linearGradient id="${uid}hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3A271D"/><stop offset="1" stop-color="${hair}"/></linearGradient></defs>
<ellipse cx="105" cy="282" rx="58" ry="7" fill="#1F2A37" opacity=".12"/>
<path d="M80,236 v38 h18 v-38z M112,236 v38 h18 v-38z" fill="#33414F"/>
<path d="M74,274 h28 q2,8 -4,9 h-26 q-4,-4 2,-9z M108,274 h28 q6,5 2,9 h-26 q-6,-1 -4,-9z" fill="#1F2A37"/>
<path d="M60,166 q45,-22 90,0 l8,80 q-53,12 -106,0z" fill="url(#${uid}coat)" stroke="#C9D3DD" stroke-width="2"/>
<path d="M88,160 l17,30 l17,-30z" fill="#2A9D8F"/><path d="M98,160 l7,12 l7,-12z" fill="#fff" opacity=".35"/>
<path d="M86,160 l19,34 l-10,52 M124,160 l-19,34" stroke="#C9D3DD" stroke-width="2" fill="none"/>
<path d="M86,160 l-6,22 l14,4z M124,160 l6,22 l-14,4z" fill="#fff" stroke="#C9D3DD" stroke-width="1.5"/>
<rect x="122" y="200" width="20" height="18" rx="3" fill="#fff" stroke="#C9D3DD" stroke-width="1.5"/>
<rect x="126" y="192" width="3" height="14" rx="1.5" fill="#C8553D"/><rect x="132" y="190" width="3" height="16" rx="1.5" fill="#2A9D8F"/><rect x="137" y="194" width="3" height="12" rx="1.5" fill="#E9B44C"/>
<circle cx="105" cy="212" r="3" fill="#C9D3DD"/><circle cx="105" cy="230" r="3" fill="#C9D3DD"/>
${arms}
<path d="M93,138 h24 v24 q-12,6 -24,0z" fill="${skinD}"/>
<ellipse cx="46" cy="104" rx="10" ry="13" fill="${skin}"/><ellipse cx="164" cy="104" rx="10" ry="13" fill="${skin}"/>
<ellipse cx="46" cy="104" rx="5" ry="7" fill="${skinD}" opacity=".5"/><ellipse cx="164" cy="104" rx="5" ry="7" fill="${skinD}" opacity=".5"/>
<ellipse cx="105" cy="98" rx="58" ry="54" fill="url(#${uid}face)"/>
<path d="M47,92 q-6,-52 46,-60 q40,-6 62,22 q10,14 8,38 q-6,-18 -18,-24 q-22,10 -52,6 q-26,-4 -36,8 q-6,4 -10,10z" fill="url(#${uid}hair)"/>
<path d="M70,50 q22,-14 50,-8" stroke="#5A3D2E" stroke-width="4" fill="none" stroke-linecap="round" opacity=".7"/>
<path d="M50,66 h110" stroke="#1F2A37" stroke-width="7" stroke-linecap="round"/>
<rect x="66" y="52" width="34" height="24" rx="11" fill="url(#${uid}lens)" stroke="#1F2A37" stroke-width="4"/>
<rect x="110" y="52" width="34" height="24" rx="11" fill="url(#${uid}lens)" stroke="#1F2A37" stroke-width="4"/>
<path d="M100,63 h10" stroke="#1F2A37" stroke-width="4"/>
<path d="M73,60 q4,-4 10,-3 M117,60 q4,-4 10,-3" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
<path d="${brows}" stroke="${hair}" stroke-width="5" fill="none" stroke-linecap="round"/>
${eye(84)}${eye(116)}
<path d="M101,108 q4,6 -1,9" stroke="${skinD}" stroke-width="3" fill="none" stroke-linecap="round"/>
<ellipse cx="70" cy="118" rx="9" ry="6" fill="#E5806E" opacity=".35"/><ellipse cx="140" cy="118" rx="9" ry="6" fill="#E5806E" opacity=".35"/>
${mouth}
${front}
</svg>`;
}

/* ===== Add new lessons here =====
   grade → subject → term (1,2,3) → unit → lessons [file, English title, Arabic title, number] */
const DATA={
 "9":{en:"Grade 9",ar:"الصف التاسع",subjects:{
   math:{en:"Math",ar:"الرياضيات",ic:"➗",terms:{1:[
     {en:"Unit 1 · Expressions",ar:"الوحدة 1 · العبارات",lessons:[
       ["g9-math-l1.html","Numerical Expressions","العبارات العددية","1"]]}]}},
   science:{en:"Science",ar:"العلوم",ic:"🔬",terms:{1:[
     {en:"Ecology",ar:"علم البيئة",lessons:[
       ["g9-science-l1.html","Organisms and Their Relationships","الكائنات الحية والعلاقات بينها","1"],
       ["g9-science-l2.html","Ecology and the Biosphere","علم البيئة والمحيط الحيوي","2"],
       ["g9-science-l3.html","Levels of Organization","مستويات التنظيم","3"]]}]}}}},
 "7":{en:"Grade 7",ar:"الصف السابع",subjects:{
   math:{en:"Math",ar:"الرياضيات",ic:"➗",terms:{1:[
     {en:"Unit 2 · Volume",ar:"الوحدة 2 · الحجم",lessons:[
       ["math-volume-l2-7.html","Solving Problems Involving Volume","حل مسائل الحجم","2-7"]]}]}},
   science:{en:"Science",ar:"العلوم",ic:"🔬",terms:{1:[
     {en:"Geologic Time",ar:"الزمن الجيولوجي",lessons:[
       ["g7-science-l1.html","Analyzing the Rock and Fossil Records","تحليل سجلات الصخور والأحافير","1"]]}]}}}}
};
const TERMS={1:["Term 1","الفصل الدراسي الأول"],2:["Term 2","الفصل الدراسي الثاني"],3:["Term 3","الفصل الدراسي الثالث"]};
/* Term 1 = Aug–Jan, Term 2 = Feb–Apr, Term 3 = May–Jul */
const m=new Date().getMonth(), CUR=(m>=7||m===0)?1:(m<=3?2:3);
const app=document.getElementById("app");
const count=s=>Object.values(s.terms).flat().reduce((n,u)=>n+u.lessons.length,0);
function crumbs(parts){return `<nav class="crumbs">${parts.map((p,i)=>i<parts.length-1?`<a href="${p[1]}">${p[0]}</a><span>›</span>`:`<span>${p[0]}</span>`).join("")}</nav>`;}
function render(){
  const [g,s]=location.hash.replace("#","").split("/");
  const G=DATA[g], S=G&&G.subjects[s];
  if(S){
    app.innerHTML=crumbs([["Home","#"],[G.en,"#"+g],[S.en]])+`<h2>${S.ic} ${S.en}</h2><p class="sub ar">${S.ar} · ${G.ar}</p><div class="terms">`+
      [1,2,3].map(t=>{const units=S.terms[t]||[];
        return `<div class="term ${t===CUR?"open cur":""}"><button><span>${TERMS[t][0]}<span class="ar" style="display:block">${TERMS[t][1]}</span></span>${t===CUR?'<span class="now">Now<span class="ar" style="display:inline"> · الحالي</span></span>':""}<i>›</i></button><div class="body">`+
          (units.length?units.map(u=>`<div class="unit">${u.en}<span class="ar">${u.ar}</span></div>`+u.lessons.map(l=>`<a class="lesson" href="${l[0]}"><span class="num">${l[3]}</span><span><b>${l[1]}</b><span class="ar">${l[2]}</span></span></a>`).join("")).join("")
           :`<div class="soon">Coming soon<span class="ar" style="display:inline"> · قريبًا</span></div>`)+`</div></div>`;}).join("")+`</div>`;
    app.querySelectorAll(".term>button").forEach(b=>b.onclick=()=>b.parentNode.classList.toggle("open"));
  } else if(G){
    app.innerHTML=crumbs([["Home","#"],[G.en]])+`<h2>${G.en}</h2><p class="sub ar">${G.ar}</p><div class="grid">`+
      Object.entries(G.subjects).map(([k,S])=>`<a class="tile" href="#${g}/${k}"><span class="ic">${S.ic}</span><span><b>${S.en}</b><span class="ar">${S.ar}</span><span class="n">${count(S)} ${count(S)===1?"lesson":"lessons"}</span></span></a>`).join("")+`</div>`;
  } else {
    app.innerHTML=`<div class="hero"><div><h2>Science and math that finally make sense</h2><p>Interactive lessons by Mr. Mustafa for Grades 7 and 9.</p><p class="ar" style="color:#F6D88E;margin-top:6px">العلوم والرياضيات بطريقة تفهمها أخيرًا · دروس تفاعلية مع أ. مصطفى</p></div><div class="hz" id="heroZ"></div></div><h2>Choose your grade</h2><p class="sub ar">اختر صفّك</p><div class="grid">`+
      Object.entries(DATA).sort((a,b)=>b[0]-a[0]).map(([k,G])=>`<a class="tile" href="#${k}"><span class="ic">🎓</span><span><b>${G.en}</b><span class="ar">${G.ar}</span><span class="n">${Object.values(G.subjects).reduce((n,S)=>n+count(S),0)} lessons</span></span></a>`).join("")+`</div>`;
  }
  const hz=document.getElementById('heroZ');if(hz)hz.innerHTML=zayed('happy');
  window.scrollTo(0,0);
}
const arBtn=document.getElementById("arBtn");
function setAr(on){document.body.classList.toggle("showar",on);try{localStorage.setItem("lessonsAr",on?"1":"0")}catch(e){}}
try{setAr(localStorage.getItem("lessonsAr")==="1")}catch(e){}
arBtn.onclick=()=>setAr(!document.body.classList.contains("showar"));
addEventListener("hashchange",render);render();
</script>
</body>
</html>
