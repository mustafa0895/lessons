<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mr. Mustafa · Interactive Lessons</title>
<link rel="icon" type="image/png" href="brand/favicon.png">
<link rel="apple-touch-icon" href="brand/apple-touch-icon.png">
<meta name="theme-color" content="#1F2A37">
<style>
:root{--sand:#F7F1E8;--ink:#1F2A37;--terra:#C8553D;--teal:#2A9D8F;--ochre:#E9B44C;--clay:#8C5A3C;--line:#E2D5C0;--muted:#6B7480}
*{box-sizing:border-box}
body{margin:0;background:var(--sand);min-height:100vh;background-image:url("data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20width%3D%22260%22%20height%3D%22260%22%20viewBox%3D%220%200%20260%20260%22%3E%3Cg%20fill%3D%22none%22%20stroke%3D%22%231F2A37%22%20stroke-opacity%3D%22.09%22%20stroke-width%3D%222%22%20stroke-linecap%3D%22round%22%20stroke-linejoin%3D%22round%22%3E%0A%3Cg%20transform%3D%22translate%2840%2C40%29%22%3E%3Cellipse%20rx%3D%2222%22%20ry%3D%228%22/%3E%3Cellipse%20rx%3D%2222%22%20ry%3D%228%22%20transform%3D%22rotate%2860%29%22/%3E%3Cellipse%20rx%3D%2222%22%20ry%3D%228%22%20transform%3D%22rotate%28-60%29%22/%3E%3Ccircle%20r%3D%223%22/%3E%3C/g%3E%0A%3Cpath%20d%3D%22M150%2C22%20v18%20l-14%2C26%20q-2%2C6%204%2C6%20h32%20q6%2C0%204%2C-6%20l-14%2C-26%20v-18%20M146%2C22%20h16%22/%3E%0A%3Ctext%20x%3D%22210%22%20y%3D%2260%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2230%22%20fill%3D%22%231F2A37%22%20fill-opacity%3D%22.09%22%20stroke%3D%22none%22%3E%CF%80%3C/text%3E%0A%3Cpath%20d%3D%22M24%2C140%20l8%2C-4%20l10%2C22%20l14%2C-40%20h26%22/%3E%3Ctext%20x%3D%2262%22%20y%3D%22150%22%20font-family%3D%22Georgia%2Cserif%22%20font-style%3D%22italic%22%20font-size%3D%2222%22%20fill%3D%22%231F2A37%22%20fill-opacity%3D%22.09%22%20stroke%3D%22none%22%3Ex%3C/text%3E%0A%3Cpath%20d%3D%22M140%2C160%20l24%2C-40%20l24%2C40z%22/%3E%3Ccircle%20cx%3D%22222%22%20cy%3D%22140%22%20r%3D%2216%22/%3E%3Cpath%20d%3D%22M222%2C124%20v32%20M206%2C140%20h32%22%20stroke-opacity%3D%22.05%22/%3E%0A%3Cpath%20d%3D%22M30%2C220%20h16%20M38%2C212%20v16%22/%3E%3Cpath%20d%3D%22M90%2C210%20l12%2C12%20M102%2C210%20l-12%2C12%22/%3E%3Cpath%20d%3D%22M150%2C216%20h18%22/%3E%3Ccircle%20cx%3D%22159%22%20cy%3D%22209%22%20r%3D%221.6%22/%3E%3Ccircle%20cx%3D%22159%22%20cy%3D%22223%22%20r%3D%221.6%22/%3E%0A%3Ctext%20x%3D%22196%22%20y%3D%22230%22%20font-family%3D%22Georgia%2Cserif%22%20font-size%3D%2220%22%20fill%3D%22%231F2A37%22%20fill-opacity%3D%22.09%22%20stroke%3D%22none%22%3Ex%C2%B2%3C/text%3E%0A%3Cpath%20d%3D%22M100%2C90%20q10%2C-14%2020%2C0%20t20%2C0%22/%3E%3C/g%3E%3C/svg%3E");background-size:260px 260px;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;-webkit-tap-highlight-color:transparent}
main{max-width:560px;margin:0 auto;padding:16px 16px 48px}
header{display:flex;align-items:center;gap:10px;margin-bottom:6px}
header .logo{height:50px;width:auto;flex:none}
header h1{font-size:20px;margin:0}
header .tag{display:block;font-size:12.5px;color:var(--muted);font-weight:600;margin-top:1px}
header small{display:block;direction:rtl;text-align:left;color:var(--clay);font-weight:700;font-size:13px}
.crumbs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:14px 0 6px;font-size:14px}
.crumbs a{color:var(--teal);font-weight:700;text-decoration:none}
.crumbs span{color:var(--muted)}
h2{margin:6px 0 2px;font-size:24px}
.ar{direction:rtl;color:var(--clay);font-weight:700}
p.sub{margin:0 0 14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tile{display:flex;flex-direction:column;justify-content:space-between;min-height:110px;background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;text-decoration:none;color:var(--ink);box-shadow:0 2px 10px rgba(31,42,55,.06)}
.tile:active{transform:scale(.98)}
.tile .ic{font-size:30px}
.tile b{font-size:18px;display:block}
.tile .ar{font-size:14px;display:block}
.tile .n{font-size:12px;color:var(--muted);font-weight:600}
.term{background:#fff;border:1px solid var(--line);border-radius:16px;margin-bottom:10px;overflow:hidden}
.term>button{width:100%;display:flex;justify-content:space-between;align-items:center;gap:8px;border:none;background:none;padding:14px 16px;font:inherit;font-weight:800;font-size:17px;color:var(--ink);text-align:left}
.term>button .ar{font-size:14px}
.term>button i{font-style:normal;transition:transform .2s;color:var(--muted)}
.term.open>button i{transform:rotate(90deg)}
.term .body{display:none;padding:0 12px 12px}
.term.open .body{display:block}
.now{font-size:11px;font-weight:700;background:var(--teal);color:#fff;border-radius:999px;padding:3px 8px;margin-left:auto;white-space:nowrap}
.unit{margin:8px 4px 6px;font-size:13px;font-weight:800;color:var(--terra);text-transform:uppercase;letter-spacing:.04em}
.unit .ar{display:block;text-transform:none;letter-spacing:0;font-size:13px}
.lesson{display:flex;align-items:center;gap:12px;background:var(--sand);border-radius:12px;padding:12px;margin-bottom:6px;text-decoration:none;color:var(--ink)}
.lesson .num{width:34px;height:34px;border-radius:50%;background:var(--teal);color:#fff;font-weight:800;display:grid;place-items:center;flex:none;font-size:14px}
.lesson b{display:block;font-size:15px}
.lesson .ar{display:block;font-size:13px;font-weight:600}
.soon{color:var(--muted);font-size:14px;padding:4px 6px 8px}
footer{margin-top:28px;text-align:center;color:var(--muted);font-size:12px}

.arbtn{margin-left:auto;width:44px;height:44px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:800;font-size:20px;color:var(--ink);flex:none}
body.showar .arbtn{background:var(--teal);border-color:var(--teal);color:#fff}
body:not(.showar) .ar{display:none!important}
@media (hover:hover){
 body:not(.showar) .lesson:hover .ar,body:not(.showar) .unit:hover .ar{display:block!important}
 body:not(.showar) .tile:hover,body:not(.showar) .lesson:hover{border-color:var(--teal)}
}

.hero{display:flex;align-items:center;gap:10px;background:linear-gradient(120deg,var(--ink),#24515a 60%,var(--teal));color:#fff;border-radius:20px;padding:16px 14px 16px 18px;margin:14px 0 18px;overflow:hidden}
.hero h2{color:#fff;font-size:19px;margin:0 0 6px;line-height:1.25}
.hero p{margin:0;font-size:13.5px;opacity:.9;line-height:1.4}
.hero .sym{font:700 26px "Cambria Math",Cambria,serif;color:var(--ochre);letter-spacing:4px;white-space:nowrap;margin-left:auto}
.grid,.terms{margin-top:12px}
@media (min-width:900px){.grid,.terms{margin-top:18px}}
@media (min-width:900px){
 main{max-width:1120px;padding:28px 40px 60px}
 header .logo{height:64px}
 header h1{font-size:26px}
 .hero{display:flex;align-items:center;justify-content:space-between;gap:24px;background:linear-gradient(120deg,var(--ink),#24515a 60%,var(--teal));color:#fff;border-radius:24px;padding:34px 40px;margin:18px 0 26px}
 .hero h2{color:#fff;font-size:34px;margin:0 0 8px}
 .hero p{margin:0;opacity:.85;font-size:17px;max-width:520px;line-height:1.5}
  .hero .sym{font:700 54px "Cambria Math",Cambria,serif;color:var(--ochre);letter-spacing:10px;white-space:nowrap}
 h2{font-size:30px}
 .grid{grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px}
 .tile{min-height:170px;padding:22px;border-radius:22px;transition:transform .15s,box-shadow .15s,border-color .15s}
 .tile:hover{transform:translateY(-4px);box-shadow:0 10px 26px rgba(31,42,55,.12);border-color:var(--teal)}
 .tile .ic{font-size:40px}
 .tile b{font-size:22px}
 .terms{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;align-items:start}
 .term{margin:0}
 .term .body{display:block}
 .term>button{cursor:default;pointer-events:none}
 .term>button i{display:none}
 .lesson{transition:background .15s}
 .lesson:hover{background:#EFE4D2}
 .crumbs{font-size:15px}
}
</style>
</head>
<body>
<main>
  <header><img class="logo" src="brand/logo-dark.png" alt="Mr. Mustafa logo"><div><h1>Mr. Mustafa</h1><span class="tag">Interactive Lessons</span></div><button class="arbtn" id="arBtn" aria-label="Show Arabic">ع</button></header>
  <div id="app"></div>
  <noscript>
    <h2>All lessons</h2>
    <p><a href="g9-math-l1.html">Grade 9 Math · Numerical Expressions</a></p>
    <p><a href="g9-science-l1.html">Grade 9 Science · L1 Organisms and Their Relationships</a></p>
    <p><a href="g9-science-l2.html">Grade 9 Science · L2 Ecology and the Biosphere</a></p>
    <p><a href="g9-science-l3.html">Grade 9 Science · L3 Levels of Organization</a></p>
    <p><a href="g8-science-l2.html">Grade 8 Science · Earth's Fossil Records</a></p>
    <p><a href="g8-science-l1.html">Grade 8 Science · Reading Earth's Rock Records</a></p>
    <p><a href="g7-science-l1.html">Grade 7 Science · Rock and Fossil Records</a></p>
    <p><a href="math-volume-l2-7.html">Grade 7 Math · Solving Problems Involving Volume</a></p>
  </noscript>
  <footer>Open lessons in Safari or Chrome</footer>
</main>
<script>


/* ===== Add new lessons here =====
   grade → subject → term (1,2,3) → unit → lessons [file, English title, Arabic title, number] */
const DATA={
 "9":{en:"Grade 9",ar:"الصف التاسع",subjects:{
   math:{en:"Math",ar:"الرياضيات",ic:"➗",terms:{1:[
     {en:"Unit 1 · Expressions",ar:"الوحدة 1 · العبارات",lessons:[
       ["g9-math-l1.html","Numerical Expressions","العبارات العددية","1"]]}]}},
   science:{en:"Science",ar:"العلوم",ic:"🔬",terms:{1:[
     {en:"Ecology",ar:"علم البيئة",lessons:[
       ["g9-science-l1.html","Organisms and Their Relationships","الكائنات الحية والعلاقات بينها","1"],
       ["g9-science-l2.html","Ecology and the Biosphere","علم البيئة والمحيط الحيوي","2"],
       ["g9-science-l3.html","Levels of Organization","مستويات التنظيم","3"]]}]}}}},
 "8":{en:"Grade 8",ar:"الصف الثامن",subjects:{
   science:{en:"Science",ar:"العلوم",ic:"🔬",terms:{1:[
     {en:"Earth's Rock Records",ar:"السجلات الصخرية للأرض",lessons:[
       ["g8-science-l1.html","Reading Earth's Rock Records","قراءة السجلات الصخرية للأرض","1"],
       ["g8-science-l2.html","Earth's Fossil Records","السجلات الأحفورية للأرض","2"]]}]}}}},
 "7":{en:"Grade 7",ar:"الصف السابع",subjects:{
   math:{en:"Math",ar:"الرياضيات",ic:"➗",terms:{1:[
     {en:"Unit 2 · Volume",ar:"الوحدة 2 · الحجم",lessons:[
       ["math-volume-l2-7.html","Solving Problems Involving Volume","حل مسائل الحجم","2-7"]]}]}},
   science:{en:"Science",ar:"العلوم",ic:"🔬",terms:{1:[
     {en:"Geologic Time",ar:"الزمن الجيولوجي",lessons:[
       ["g7-science-l1.html","Analyzing the Rock and Fossil Records","تحليل سجلات الصخور والأحافير","1"]]}]}}}}
};
const TERMS={1:["Term 1","الفصل الدراسي الأول"],2:["Term 2","الفصل الدراسي الثاني"],3:["Term 3","الفصل الدراسي الثالث"]};
/* Term 1 = Aug–Jan, Term 2 = Feb–Apr, Term 3 = May–Jul */
const m=new Date().getMonth(), CUR=(m>=7||m===0)?1:(m<=3?2:3);
const app=document.getElementById("app");
const count=s=>Object.values(s.terms).flat().reduce((n,u)=>n+u.lessons.length,0);
function crumbs(parts){return `<nav class="crumbs">${parts.map((p,i)=>i<parts.length-1?`<a href="${p[1]}">${p[0]}</a><span>›</span>`:`<span>${p[0]}</span>`).join("")}</nav>`;}
function render(){
  const [g,s]=location.hash.replace("#","").split("/");
  const G=DATA[g], S=G&&G.subjects[s];
  if(S){
    app.innerHTML=crumbs([["Home","#"],[G.en,"#"+g],[S.en]])+`<h2>${S.ic} ${S.en}</h2><div class="terms">`+
      [1,2,3].map(t=>{const units=S.terms[t]||[];
        return `<div class="term ${t===CUR?"open cur":""}"><button><span>${TERMS[t][0]}</span>${t===CUR?'<span class="now">Now</span>':""}<i>›</i></button><div class="body">`+
          (units.length?units.map(u=>`<div class="unit">${u.en}<span class="ar">${u.ar}</span></div>`+u.lessons.map(l=>`<a class="lesson" href="${l[0]}"><span class="num">${l[3]}</span><span><b>${l[1]}</b><span class="ar">${l[2]}</span></span></a>`).join("")).join("")
           :`<div class="soon">Coming soon</div>`)+`</div></div>`;}).join("")+`</div>`;
    app.querySelectorAll(".term>button").forEach(b=>b.onclick=()=>b.parentNode.classList.toggle("open"));
  } else if(G){
    app.innerHTML=crumbs([["Home","#"],[G.en]])+`<h2>${G.en}</h2><div class="grid">`+
      Object.entries(G.subjects).map(([k,S])=>`<a class="tile" href="#${g}/${k}"><span class="ic">${S.ic}</span><span><b>${S.en}</b><span class="n">${count(S)} ${count(S)===1?"lesson":"lessons"}</span></span></a>`).join("")+`</div>`;
  } else {
    app.innerHTML=`<div class="hero"><div><h2>Science and math that finally make sense</h2><p>Interactive lessons by Mr. Mustafa.</p></div><div class="sym">÷ ² ( )</div></div><h2>Choose your grade</h2><div class="grid">`+
      Object.entries(DATA).sort((a,b)=>b[0]-a[0]).map(([k,G])=>`<a class="tile" href="#${k}"><span class="ic">🎓</span><span><b>${G.en}</b><span class="n">${Object.values(G.subjects).reduce((n,S)=>n+count(S),0)} lessons</span></span></a>`).join("")+`</div>`;
  }
  document.getElementById("arBtn").style.visibility=S?"visible":"hidden";
  window.scrollTo(0,0);
}
const arBtn=document.getElementById("arBtn");
function setAr(on){document.body.classList.toggle("showar",on);try{localStorage.setItem("lessonsAr",on?"1":"0")}catch(e){}}
try{setAr(localStorage.getItem("lessonsAr")==="1")}catch(e){}
arBtn.onclick=()=>setAr(!document.body.classList.contains("showar"));
addEventListener("hashchange",render);render();
</script>
</body>
</html>
